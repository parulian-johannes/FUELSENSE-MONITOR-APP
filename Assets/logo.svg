<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="64" cy="64" r="60" fill="#1E293B" stroke="#3B82F6" stroke-width="3"/>
  
  <!-- Letter E -->
  <text x="35" y="90" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#3B82F6">E</text>
  
  <!-- Gear Icon (top right) -->
  <g transform="translate(85, 28)">
    <!-- Gear outer teeth -->
    <path d="M 12,0 L 14,4 L 18,4 L 20,0 L 22,4 L 26,6 L 28,10 L 24,12 L 24,16 L 28,18 L 26,22 L 22,24 L 20,28 L 18,24 L 14,24 L 12,28 L 10,24 L 6,22 L 4,18 L 8,16 L 8,12 L 4,10 L 6,6 L 10,4 L 12,0 Z" 
          fill="#10B981" stroke="#0D9488" stroke-width="1"/>
    <!-- Gear center circle -->
    <circle cx="16" cy="14" r="6" fill="#1E293B" stroke="#0D9488" stroke-width="1"/>
    <!-- Gear center hole -->
    <circle cx="16" cy="14" r="3" fill="#374151"/>
  </g>
  
  <!-- Subtle engine line accent -->
  <line x1="30" y1="100" x2="75" y2="100" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
</svg>
